name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Lime design system rules: components, tokens, and text roles.
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Builds the app, seeds a fresh SQLite database, then runs the flows and axe checks.
      - run: npm run e2e
